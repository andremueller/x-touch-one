[project]
name = "xtouch-one-bridge"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mido>=1.3",
  "python-rtmidi>=1.5.8",
  "pyobjc-framework-Cocoa>=12.2",
  "pyobjc-framework-Quartz>=12.2",
]
[project.scripts]
xtouch-one = "xtouch_one.__main__:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["xtouch_one"]
